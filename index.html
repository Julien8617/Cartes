<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Cartes — atelier</title>
<style>
:root{
  --ws:#ece4ea;
  --ink:#2b2230;
  --ink-2:#6d6172;
  --ink-3:#a398a6;
  --line:#e6dde4;
  --mark:#98a2ac;
  --accent:#e0558f;
  --accent-soft:rgba(224,85,143,.1);
  --cond:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Roboto Condensed",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--ws);color:var(--ink);font-family:var(--sans);font-size:15px;overflow:hidden;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.app{display:flex;flex-direction:column;height:100%}

/* ---------- barre du haut ---------- */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:var(--ink);color:#fff}
.bar h1{margin:0 4px 0 2px;font-family:var(--round);font-weight:800;font-size:18px;white-space:nowrap}
.bar .grow{flex:1}
.tab,.bb{font-family:var(--round);font-weight:700;font-size:14px;color:#fff;white-space:nowrap;
  padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.1)}
.tab.on{background:#fff;color:var(--ink)}
.bb.go{background:var(--accent)}

/* ---------- vues ---------- */
.view{flex:1 1 auto;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.tb{flex:0 0 auto;padding:10px 12px;background:#fbf8fa;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.scroll{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
select,input[type=text],input[type=number]{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;min-width:0}
input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:10px;background:#fff;flex:0 0 auto}
.btn{padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-family:var(--round);font-weight:700;font-size:14px;white-space:nowrap}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.warn{color:#c0392b}
.btn.dng{background:#d64545;border-color:#d64545;color:#fff}
.meta{font-size:13px;color:var(--ink-2)}
.meta b{color:var(--ink)}

/* liste */
.dgroup{padding:14px 14px 6px;font-family:var(--round);font-weight:800;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.dgroup i{width:12px;height:12px;border-radius:50%;display:inline-block}
.item{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.item .mini{flex:0 0 auto;position:relative;overflow:hidden;border-radius:4px}
.item .mini > div{transform-origin:0 0}
.item .info{flex:1;min-width:0}
.item .nm1{font-family:var(--round);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm1.empty{color:var(--ink-3);font-weight:600}
.item .st{font-size:14px;color:var(--ink-2);margin-top:3px}
.ib{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.ib.on{background:var(--accent-soft)}
.empty-list{padding:40px 24px;text-align:center;color:var(--ink-2);line-height:1.5}

/* éditeur */
.ed{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:var(--ws)}
.ed.on{display:flex}
.ed,.bar,.tb,.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ed input,.tb input{-webkit-user-select:text;user-select:text}
.ed .top{flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:var(--ink);color:#fff}
.ed .pos{flex:1;text-align:center;font-family:var(--round);font-weight:700}
.ed .pv{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;position:relative}
.ed .pv .holder{position:relative}
.ed .pv .holder > div{transform-origin:0 0}
.ed .lockmsg{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(43,34,48,.85);color:#fff;
  font-size:13px;padding:5px 12px;border-radius:999px;display:none;white-space:nowrap}
.ed.locked .lockmsg{display:block}
.ed .form{flex:0 0 auto;max-height:52%;overflow:auto;background:#fbf8fa;border-top:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:9px}
.lab{font-size:12px;color:var(--ink-2);font-family:var(--round);font-weight:700;min-width:74px}
.stp{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stp button{width:38px;height:38px;font-size:20px;font-weight:700;color:var(--accent)}
.stp b{min-width:26px;text-align:center;font-family:var(--round);font-size:18px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats3 > div{display:flex;flex-direction:column;align-items:center;gap:3px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:8px 12px;font-family:var(--round);font-weight:700;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#fff}
input[type=range]{flex:1;accent-color:var(--accent)}
.ed.locked .form .lk{opacity:.4;pointer-events:none}

/* impression */
#pages{padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.pw{position:relative;flex:0 0 auto;box-shadow:0 1px 2px rgba(20,24,30,.2),0 10px 26px rgba(20,24,30,.18)}
.page{position:absolute;left:0;top:0;width:210mm;height:297mm;transform-origin:0 0;background:#fff;overflow:hidden;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.edge{position:absolute;left:0;right:0;top:0;height:10mm;display:flex;align-items:center;justify-content:center;
  font-family:var(--round);letter-spacing:.2em;text-transform:uppercase;font-size:2.4mm;color:var(--ink-3);border-bottom:.2mm dashed #eee}
.slotbox{position:absolute}
.slotbox .bleed{left:0;top:0}
.slotbox.used{border:.4mm dashed #d9cfd7;border-radius:1mm;background:repeating-linear-gradient(45deg,#faf6f9,#faf6f9 2mm,#fff 2mm,#fff 4mm)}
.slotbox.cut::after{content:"";position:absolute;pointer-events:none;border:.2mm dashed rgba(224,85,143,.6)}
.mark{position:absolute;background:var(--mark)}

/* réglages */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(43,34,48,.4);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{width:100%;max-width:560px;max-height:88%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet h2{margin:0 0 10px;font-family:var(--round);font-size:18px}
.sec{margin:16px 0 8px;font-family:var(--round);font-weight:800;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field select{width:100%}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:40;
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;display:none;max-width:90%;text-align:center}
.toast.on{display:block}

/* ---------- la carte ---------- */
.bleed{position:absolute;overflow:hidden;background:#fff}
.win{position:absolute;overflow:hidden;background:#fff}
.win img{position:absolute;left:50%;top:50%;display:block;max-width:none;object-fit:cover;will-change:transform}
.win.nophoto{background:#fff}
.win .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--round);letter-spacing:.12em;text-transform:uppercase;font-size:3mm;color:#c9bfc7}
.ov{position:absolute;transform-origin:0 0;pointer-events:none}
.band{position:absolute;left:0;right:0;top:0;min-height:8.5mm;display:flex;flex-direction:column;justify-content:center;gap:.6mm;
  padding:1mm 1.6mm;background:rgba(255,255,255,.93);border-bottom:.6mm solid var(--cc)}
.nm{width:100%;min-width:0;font-family:var(--cond);font-weight:700;font-size:3.9mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#14181e}
.nm .scr{color:#c9bfc7;font-weight:500}
.hearts{display:flex;gap:.4mm;color:var(--cc);font-size:4.4mm;line-height:1;-webkit-text-stroke:.25mm #14181e;min-height:4.4mm}
.stat{position:absolute;bottom:1.5mm;width:14mm;height:14mm;border-radius:50%;background:#fff;border:.9mm solid var(--cc);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.stat .ic{display:block;width:6.2mm;height:6.2mm;margin-bottom:-.5mm}
.stat .n{font-family:var(--cond);font-weight:800;font-size:7mm;color:#14181e;margin-top:.2mm}
.stat.atk{left:1.5mm}
.stat.def{right:1.5mm}
.side{position:absolute;bottom:4mm;left:50%;transform:translateX(-50%)}
.side.sym{width:10mm;height:10mm}
.side.ban{padding:.9mm 2.2mm;border-radius:1mm;font-family:var(--cond);font-weight:800;font-size:2.9mm;letter-spacing:.12em;
  background:#14181e;color:#fff;border:.4mm solid #14181e}
.side.ban.ennemi{background:#fff;color:#14181e}
.landbig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40mm;line-height:1;color:var(--cc);-webkit-text-stroke:.5mm #14181e}
.spk{position:absolute;line-height:1;color:#fff;-webkit-text-stroke:.3mm var(--cc);pointer-events:none}
/* style mignon */
.bleed.cute{background-image:radial-gradient(circle, rgba(255,255,255,.5) 22%, transparent 25%);background-size:3.4mm 3.4mm;background-position:1.7mm 1.7mm}
.cute .win{border-radius:3.5mm;border:.8mm solid #fff}
.cute .win.landw{background-color:#fff;background-image:radial-gradient(circle, var(--cc2) 18%, transparent 21%);background-size:5mm 5mm}
.cute .band{left:1.6mm;right:1.6mm;top:1.6mm;border-radius:3mm;border:.6mm solid var(--cc);background:#fff;align-items:center;text-align:center}
.cute .hearts{justify-content:center}
.cute .nm{font-family:var(--round);font-weight:800;color:#5a3d55;text-align:center}
.cute .stat{border:1mm solid var(--cc);box-shadow:inset 0 0 0 .7mm var(--cc2)}
.cute .stat .n{font-family:var(--round);font-weight:900;color:#5a3d55}
.cute .side.ban{border-radius:3mm;font-family:var(--round);background:var(--cc);border-color:var(--cc)}
.cute .side.ban.ennemi{background:#fff;color:#5a3d55}
.cute .landbig{-webkit-text-stroke:.45mm #5a3d55}

/* ---------- impression ---------- */
@page{size:A4;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .app{display:block;height:auto}
  .bar,.tb,.ed,.sheet,.toast,#vlist{display:none!important}
  #vprint{display:block!important}
  #vprint .scroll{overflow:visible}
  #pages{padding:0;display:block}
  .pw{width:210mm!important;height:297mm!important;box-shadow:none;break-after:page;page-break-after:always;overflow:hidden}
  .pw:last-child{break-after:auto;page-break-after:auto}
  .page{transform:none!important}
  .edge,.scr,.win .hint,.slotbox.used{display:none!important}
  .slotbox.cut::after{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>Cartes</h1>
    <button class="tab on" data-view="list">Mes cartes</button>
    <button class="tab" data-view="print">Imprimer</button>
    <div class="grow"></div>
    <button class="bb" id="btnSet" aria-label="Réglages">⚙︎</button>
  </div>

  <!-- vue liste -->
  <section class="view on" id="vlist">
    <div class="tb" id="listTb"></div>
    <div class="scroll" id="list"></div>
  </section>

  <!-- vue impression -->
  <section class="view" id="vprint">
    <div class="tb" id="printTb"></div>
    <div class="scroll" id="pscroll"><div id="pages"></div></div>
  </section>
</div>

<!-- éditeur de carte -->
<div class="ed" id="ed">
  <div class="top">
    <button class="bb" id="edBack">‹ Liste</button>
    <button class="bb" id="edPrev">◀</button>
    <div class="pos" id="edPos"></div>
    <button class="bb" id="edNext">▶</button>
    <button class="bb" id="edLock">🔓</button>
  </div>
  <div class="pv" id="pv"><div class="holder" id="holder"></div><div class="lockmsg">🔒 Carte verrouillée</div></div>
  <div class="form" id="form"></div>
</div>

<!-- réglages -->
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="ask" style="z-index:50"><div class="in" style="text-align:center">
  <div class="msg" style="font-family:var(--round);font-weight:700;font-size:17px;margin:6px 0 16px;line-height:1.4"></div>
  <div class="row" style="justify-content:center"><button class="btn no" style="flex:1">Annuler</button><button class="btn ok" style="flex:1"></button></div>
</div></div>
<input type="file" id="file" accept="image/*,.heic,.heif" hidden>
<input type="file" id="fileMulti" accept="image/*,.heic,.heif" multiple hidden>
<input type="file" id="fileImp" accept="application/json,.json" hidden>

<script>
"use strict";
var PW = 210, PH = 297, MM = 96/25.4;
var $ = function(id){ return document.getElementById(id); };

/* ---------- decks prédéfinis (coût-force-endurance, xN = exemplaires) ---------- */
var DECKS = [
  {id:"h1", side:"ami",    label:"Héros 1 · Dinosaures",        color:"#ff7aa8", s:"1-2-1x2,2-2-2,3-3-3x2,3-3-2,3-2-3,4-4-5x2,5-5-5"},
  {id:"h2", side:"ami",    label:"Héros 2 · Chats",             color:"#ffad5c", s:"1-2-1x2,2-2-2x2,3-3-2x2,3-4-3,4-4-4x2,5-3-3"},
  {id:"h3", side:"ami",    label:"Héros 3 · Dragons",           color:"#b57cf0", s:"1-1-1x2,2-2-1x2,3-2-2x2,4-2-3,4-4-4x2,5-5-5"},
  {id:"h4", side:"ami",    label:"Héros 4 · Anges & Licornes",  color:"#f78fd6", s:"1-2-1x2,2-2-2x2,3-2-2x3,4-3-4x2,5-5-5"},
  {id:"h5", side:"ami",    label:"Héros 5 · Mer",               color:"#5ab8f0", s:"1-1-1x2,2-2-1x2,3-2-2x2,3-1-3,4-3-3x2,5-5-5"},
  {id:"a1", side:"ennemi", label:"Adversaire 1 · Ours & Forêt", color:"#6cc070", s:"1-1-1x2,2-2-2x2,3-3-3x2,3-3-4,4-2-4,4-4-4,5-5-4"},
  {id:"a2", side:"ennemi", label:"Adversaire 2 · Gobelins & Géants", color:"#c08b5c", s:"1-1-1x2,2-2-1x2,3-2-2x3,4-3-2,4-3-3,5-4-4"},
  {id:"a3", side:"ennemi", label:"Adversaire 3 · Zombies",      color:"#8e9fb8", s:"1-2-2x2,2-2-2x2,3-2-2x3,4-2-2x2,5-4-3"},
  {id:"a4", side:"ennemi", label:"Adversaire 4 · Araignées",    color:"#7b6fd6", s:"1-1-1x2,2-1-3x2,3-2-3x3,4-2-4,4-4-4,5-5-4"},
  {id:"a5", side:"ennemi", label:"Adversaire 5 · Chevaliers",   color:"#e0a43a", s:"1-2-1x2,2-2-2x2,3-2-2x3,4-2-4x2,5-3-5"},
  // équipes de ティニピン : noms en hiragana, une carte par personnage (coût-force-endurance)
  {id:"t1", side:"ami", group:"ティニピン", label:"Les amis royaux", color:"#ff8fc8",
   s:"5-5-5,4-4-4,4-5-3,3-2-4,3-3-3,3-3-2,2-2-2,2-3-1,2-1-3,1-1-2,1-2-1",
   names:["はちゅぴん","ばろぴん","あざぴん","ちゃちゃぴん","ららぴん","はっぴん","ここぴん","にこぴん","まこぴん","わわぴん","ねねぴん"]}
];
function parseDeck(s){
  var out = [];
  s.split(",").forEach(function(t){
    var p = t.split("x"), n = p[1] ? +p[1] : 1, v = p[0].split("-").map(Number);
    for(var k=0;k<n;k++) out.push({cost:v[0], f:v[1], e:v[2]});
  });
  return out;
}
function allDecks(){ return DECKS.concat(P.custom || []); }
function deckById(id){ var L = allDecks(); for(var i=0;i<L.length;i++) if(L[i].id===id) return L[i]; return DECKS[0]; }
function deckIndex(id){ var L = allDecks(); for(var i=0;i<L.length;i++) if(L[i].id===id) return i; return 99; }

/* ---------- réglages (localStorage) ---------- */
var PK = "cartes.atelier.v2";
var P = { cardW:57, cardH:87, gap:5, top:10, bleed:5, comp:100, marks:true,
          frame:3, marker:"sym", style:"cute", lands:true,
          colors:{}, sides:{}, names:{}, skip:0, zoom:1, custom:[] };
var legacyNames = {};
try{
  var old = JSON.parse(localStorage.getItem("cartes.jeu.v1") || "null");
  if(old){
    ["colors","sides","frame","marker","style","lands"].forEach(function(k){ if(old[k] !== undefined) P[k] = old[k]; });
    legacyNames = old.names || {};
  }
  var cur = JSON.parse(localStorage.getItem(PK) || "null");
  if(cur) for(var k0 in cur) P[k0] = cur[k0];
}catch(e){}
function saveP(){ try{ localStorage.setItem(PK, JSON.stringify(P)); }catch(e){} }

function deckColor(id){ return P.colors[id] || deckById(id).color; }
function deckSide(id){ return P.sides[id] || deckById(id).side; }
function deckName(id){ return P.names[id] || deckById(id).label; }
function rgba(hex, a){
  var h = hex.replace("#",""); if(h.length===3) h = h.replace(/./g,"$&$&");
  var n = parseInt(h,16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]; }); }

/* ---------- dessins ---------- */
var INK = "#5a3d55";
var FACE_AMI = '<svg viewBox="0 0 40 40" width="100%" height="100%"><circle cx="20" cy="20" r="17.5" fill="var(--cc)" stroke="'+INK+'" stroke-width="2"/>'
  + '<ellipse cx="10.5" cy="24" rx="3.6" ry="2.3" fill="#fff" opacity=".55"/><ellipse cx="29.5" cy="24" rx="3.6" ry="2.3" fill="#fff" opacity=".55"/>'
  + '<path d="M10.5 18.5 Q14 13.5 17.5 18.5 M22.5 18.5 Q26 13.5 29.5 18.5" fill="none" stroke="'+INK+'" stroke-width="2.6" stroke-linecap="round"/>'
  + '<path d="M14.5 24.5 Q20 31 25.5 24.5 Z" fill="'+INK+'" stroke="'+INK+'" stroke-width="1.6" stroke-linejoin="round"/></svg>';
var FACE_ENN = '<svg viewBox="0 0 40 40" width="100%" height="100%"><circle cx="20" cy="20" r="17.5" fill="var(--cc)" stroke="'+INK+'" stroke-width="2"/>'
  + '<path d="M9.5 13.5 L17 16.5 M30.5 13.5 L23 16.5" stroke="'+INK+'" stroke-width="2.6" stroke-linecap="round"/>'
  + '<circle cx="14" cy="20.5" r="2.4" fill="'+INK+'"/><circle cx="26" cy="20.5" r="2.4" fill="'+INK+'"/>'
  + '<path d="M14.5 29 Q20 24.5 25.5 29" fill="none" stroke="'+INK+'" stroke-width="2.6" stroke-linecap="round"/>'
  + '<path d="M29 4.5 l2 3 M33 6.5 l-1 3.4 M35.5 10 l-3.4 .6" stroke="'+INK+'" stroke-width="1.6" stroke-linecap="round"/></svg>';
function HEART(x,y,r,fill){
  return '<path d="M'+x+' '+(y+r*.9)+' C'+(x-r*1.6)+' '+(y-r*.1)+' '+(x-r*.9)+' '+(y-r*1.3)+' '+x+' '+(y-r*.45)
    + ' C'+(x+r*.9)+' '+(y-r*1.3)+' '+(x+r*1.6)+' '+(y-r*.1)+' '+x+' '+(y+r*.9)+' Z" fill="'+fill+'" stroke="'+INK+'" stroke-width="1.6" stroke-linejoin="round"/>';
}
var ICON_ATK = '<svg viewBox="0 0 40 40" width="100%" height="100%"><g transform="rotate(45 20 20)">'

/* ---------- stockage des cartes et photos (IndexedDB) ---------- */
var DB = { db:null, ok:false };
function idbOpen(){
  return new Promise(function(res){
    try{
      var r = indexedDB.open("cartes-atelier", 1);
      r.onupgradeneeded = function(){
        var d = r.result;
        d.createObjectStore("cards", {keyPath:"id"});
        d.createObjectStore("photos", {keyPath:"id"});
      };
      r.onsuccess = function(){ DB.db = r.result; DB.ok = true; res(); };
      r.onerror = function(){ res(); };
    }catch(e){ res(); }
  });
}
function idb(store, mode, fn){
  if(!DB.ok) return Promise.resolve(null);
  return new Promise(function(res){
    try{
      var t = DB.db.transaction(store, mode), req = fn(t.objectStore(store));
      t.oncomplete = function(){ res(req ? req.result : null); };
      t.onerror = t.onabort = function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function putCard(c){ return idb("cards","readwrite",function(st){ return st.put(c); }); }
function delCard(id){ return idb("cards","readwrite",function(st){ return st.delete(id); }); }

/* ---------- état ---------- */
var S = { cards:[], photos:{}, aspect:{}, filter:"all", edit:null, view:"list", selMode:false, sel:{} };
// proportions réelles des images (pour pouvoir dézoomer sans rogner)
var aspTimer = null;
function aspectOf(pid){
  if(S.aspect[pid]) return S.aspect[pid];
  if(S.aspect[pid] === undefined && S.photos[pid]){
    S.aspect[pid] = 0;
    var im = new Image();
    im.onload = function(){
      S.aspect[pid] = im.naturalWidth / im.naturalHeight || 1;
      clearTimeout(aspTimer); aspTimer = setTimeout(refresh, 30);
    };
    im.src = S.photos[pid];
  }
  return 0;
}
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function cardById(id){ for(var i=0;i<S.cards.length;i++) if(S.cards[i].id===id) return S.cards[i]; return null; }
function sorted(list){
  return list.slice().sort(function(a,b){
    return (deckIndex(a.deck)-deckIndex(b.deck)) || ((a.land?1:0)-(b.land?1:0))
        || ((a.land?0:a.cost)-(b.land?0:b.cost)) || (a.order-b.order);
  });
}
function visible(){
  return sorted(S.cards.filter(function(c){ return S.filter==="all" || c.deck===S.filter; }));
}
function newCard(o){
  var c = { id:uid("c"), deck:o.deck||"h1", land:!!o.land, name:o.name||"", cost:o.cost||1, f:o.f||1, e:o.e||1,
            photo:null, crop:{dx:0, dy:0, z:1, rot:0}, locked:false, print:true, order:Date.now()+(o.n||0) };
  S.cards.push(c); putCard(c);
  return c;
}
function genDeck(id, nLands){
  nLands = nLands || 0;
  var d = deckById(id), base = d.s ? parseDeck(d.s) : [];
  base.forEach(function(s, i){
    newCard({deck:id, cost:s.cost, f:s.f, e:s.e, name:(d.names && d.names[i]) || legacyNames[id+":"+i] || "", n:i});
  });
  for(var k=0;k<nLands;k++) newCard({deck:id, land:true, n:100+k});
}

/* ---------- photos ---------- */
function isHeic(f){ return /image\/hei[cf]/i.test(f.type||"") || /\.hei[cf]$/i.test(f.name||""); }
function loadHeic(){
  if(window.heic2any) return Promise.resolve(true);
  return new Promise(function(res){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
    s.onload = function(){ res(true); }; s.onerror = function(){ res(false); };
    document.head.appendChild(s);
  });
}
function shrink(blob){
  return createImageBitmap(blob).then(function(bmp){
    var m = 1400, k = Math.min(1, m/Math.max(bmp.width, bmp.height));
    var cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return new Promise(function(r){ cv.toBlob(function(b){ r(b || blob); }, "image/jpeg", .88); });
  });
}
function importPhoto(file){
  return shrink(file).catch(function(){
    if(!isHeic(file)) return file;
    toast("Conversion HEIC…");
    return loadHeic().then(function(ok){
      if(!ok) return file;
      return window.heic2any({blob:file, toType:"image/jpeg", quality:.88}).then(function(b){ return shrink(Array.isArray(b)?b[0]:b).catch(function(){ return b; }); });
    });
  }).then(blobToDataURL).then(function(data){
    var id = uid("p");
    S.photos[id] = data;
    return savePhoto(id, data).then(function(){ return id; });
  });
}
// les images sont gardées en texte (data URL) : c'est le format le plus fiable sur iPhone
function savePhoto(id, data){
  return idb("photos","readwrite",function(st){ return st.put({id:id, data:data}); });
}
function recData(r){
  if(r.data) return Promise.resolve(r.data);
  var b = r.buf ? new Blob([r.buf], {type:r.type || "image/jpeg"}) : r.blob;
  if(!b) return Promise.reject();
  return blobToDataURL(b).then(function(d){ savePhoto(r.id, d); return d; }); // ancien format : conversion
}
function dropPhotoIfUnused(pid){
  if(!pid) return;
  if(S.cards.some(function(c){ return c.photo===pid; })) return;
  idb("photos","readwrite",function(st){ return st.delete(pid); });
  delete S.photos[pid]; delete S.aspect[pid];
}

/* ---------- rendu d'une carte ---------- */
// f : facteur d'échelle d'impression ; b : fond perdu en mm (bx,by)
function imgTransform(c, f){
  var cr = c.crop;
  return "translate(-50%,-50%) translate("+(cr.dx*f)+"mm,"+(cr.dy*f)+"mm) rotate("+cr.rot+"deg) scale("+cr.z+")";
}
function cardEl(c, f, bx, by){
  f = f || 1; bx = bx || 0; by = by || 0;
  var w = P.cardW*f, h = P.cardH*f, T = P.frame*f;
  var col = deckColor(c.deck), side = deckSide(c.deck), cute = P.style==="cute";
  var bl = document.createElement("div");
  bl.className = "bleed" + (cute ? " cute" : "");
  bl.style.cssText = "width:"+(w+2*bx)+"mm;height:"+(h+2*by)+"mm;background-color:"+col;
  bl.style.setProperty("--cc", col);
  bl.style.setProperty("--cc2", rgba(col, .16));

  var ww = w - 2*T, wh = h - 2*T;
  var win = document.createElement("div");
  win.className = "win";
  win.style.cssText = "left:"+(bx+T)+"mm;top:"+(by+T)+"mm;width:"+ww+"mm;height:"+wh+"mm";
  if(c.land){
    win.className += " landw";
    win.innerHTML = '<div class="landbig">♥</div>'
      + (cute ? '<span class="spk" style="left:22%;top:24%;font-size:6mm">✦</span><span class="spk" style="right:20%;top:30%;font-size:4mm">✦</span><span class="spk" style="right:26%;bottom:22%;font-size:5mm">✦</span><span class="spk" style="left:24%;bottom:28%;font-size:3.5mm">✦</span>' : '');
    bl.appendChild(win);
    return bl;
  }
  var url = c.photo && S.photos[c.photo];
  if(url){
    var img = document.createElement("img");
    img.src = url; img.draggable = false;
    img.onerror = function(){
      win.className += " nophoto";
      win.innerHTML = '<div class="hint" style="text-align:center;line-height:1.4">image illisible<br>à rechoisir</div>';
    };
    var swap = (c.crop.rot % 180) !== 0, a = aspectOf(c.photo);
    if(a){
      // l'image garde ses proportions et couvre la fenêtre à 100 %
      var va = swap ? 1/a : a, vw, vh;
      if(va > ww/wh){ vh = wh; vw = wh*va; } else { vw = ww; vh = ww/va; }
      img.style.width  = (swap ? vh : vw) + "mm";
      img.style.height = (swap ? vw : vh) + "mm";
      img.style.objectFit = "fill";
    } else {
      img.style.width  = (swap ? wh : ww) + "mm";
      img.style.height = (swap ? ww : wh) + "mm";
    }
    img.style.transform = imgTransform(c, f);
    win.appendChild(img);
  } else {
    win.className += " nophoto";
    win.innerHTML = '<div class="hint">image</div>';
  }
  bl.appendChild(win);

  var ov = document.createElement("div");
  ov.className = "ov";
  ov.style.cssText = "left:"+(bx+T)+"mm;top:"+(by+T)+"mm;width:"+(P.cardW-2*P.frame)+"mm;height:"+(P.cardH-2*P.frame)+"mm;transform:scale("+f+")";
  var hh = '<div class="band"><div class="hearts">';
  for(var k=0;k<c.cost;k++) hh += '♥';
  hh += '</div><div class="nm">' + (c.name ? esc(c.name) : '<span class="scr">Nom…</span>') + '</div></div>';
  hh += '<div class="stat atk"><span class="ic">'+ICON_ATK+'</span><span class="n">'+c.f+'</span></div>';
  hh += '<div class="stat def"><span class="ic">'+ICON_DEF+'</span><span class="n">'+c.e+'</span></div>';
  if(cute) hh += '<span class="spk" style="right:2.5mm;top:16mm;font-size:4.6mm">✦</span><span class="spk" style="right:6.5mm;top:22mm;font-size:2.8mm">✦</span><span class="spk" style="left:3mm;top:19mm;font-size:3.2mm">✦</span>';
  if(P.marker==="sym") hh += '<div class="side sym">' + (side==="ami" ? FACE_AMI : FACE_ENN) + '</div>';
  if(P.marker==="ban") hh += '<div class="side ban '+side+'">' + (side==="ami" ? "AMI" : "ENNEMI") + '</div>';
  ov.innerHTML = hh;
  bl.appendChild(ov);
  return bl;
}

function renderListBody(){

// cadrage : glisser pour déplacer, pincer pour zoomer
(function(){
  var pv = $("pv"), ptrs = {}, base = null;
  function pts(){ return Object.keys(ptrs).map(function(k){ return ptrs[k]; }); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  pv.addEventListener("pointerdown", function(e){
    var c = edCard(); if(!c || c.locked || c.land || !c.photo) return;
    pv.setPointerCapture(e.pointerId);
    ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
    var p = pts();
    base = { dx:c.crop.dx, dy:c.crop.dy, z:c.crop.z, p0:p[0], d:p.length>1 ? dist(p[0],p[1]) : 0, n:p.length };
  });
  pv.addEventListener("pointermove", function(e){
    if(!ptrs[e.pointerId] || !base) return;
    ptrs[e.pointerId] = {x:e.clientX, y:e.clientY};
    var c = edCard(), p = pts(), s = MM*E.k;
    if(p.length > 1 && base.d){
      c.crop.z = Math.max(.3, Math.min(4, base.z * dist(p[0],p[1]) / base.d));
    } else if(p.length === 1 && base.n === 1){
      c.crop.dx = base.dx + (p[0].x - base.p0.x)/s;
      c.crop.dy = base.dy + (p[0].y - base.p0.y)/s;
    }
    updateImg();
  });
  function up(e){
    if(!ptrs[e.pointerId]) return;
    delete ptrs[e.pointerId];
    var c = edCard(), p = pts();
    if(c) putCard(c);
    base = p.length && c ? { dx:c.crop.dx, dy:c.crop.dy, z:c.crop.z, p0:p[0], d:0, n:p.length } : null;
  }
  pv.addEventListener("pointerup", up);
  pv.addEventListener("pointercancel", up);
  pv.addEventListener("wheel", function(e){
    var c = edCard(); if(!c || c.locked || !c.photo) return;
    e.preventDefault();
    c.crop.z = Math.max(.3, Math.min(4, c.crop.z * (e.deltaY < 0 ? 1.08 : 1/1.08)));
    updateImg(); putCard(c);
  }, {passive:false});
})();

/* ---------- impression ---------- */
function geom(){
  var f = P.comp/100;
  var w = P.cardW*f, h = P.cardH*f, g = P.gap*f, t = P.top*f;
  var cols = Math.max(1, Math.floor((PW + g)/(w + g)));
  var rows = Math.max(1, Math.floor((PH - t + g)/(h + g)));
  var gw = cols*w + (cols-1)*g, b = P.bleed/100;
  return { f:f, w:w, h:h, g:g, t:t, cols:cols, rows:rows, bx:w*b/2, by:h*b/2, gw:gw, x0:(PW-gw)/2 };
}
// ordre de remplissage : du bas vers le haut (on peut réengager une feuille entamée)
function fillOrder(G){
  var o = [];
  for(var r=G.rows-1;r>=0;r--) for(var c=0;c<G.cols;c++) o.push(r*G.cols + c);
  return o;
}
function printList(){ return sorted(S.cards.filter(function(c){ return c.print; })); }
function layoutPages(){
  var G = geom(), per = G.cols*G.rows, order = fillOrder(G), list = printList();
  var skip = Math.min(P.skip, per-1), pages = [], i = 0, first = true;
  while(i < list.length){
    var slots = {}, start = first ? skip : 0;
    for(var s=start; s<per && i<list.length; s++) slots[order[s]] = list[i++];
    pages.push({slots:slots, used: first ? order.slice(0, skip) : []});
    first = false;
  }
  return {G:G, pages:pages, n:list.length};
}
function renderPrintTb(L){
  var per = L.G.cols*L.G.rows;
  var h = '<div class="row"><span class="meta" style="flex:1"><b>'+L.n+'</b> cartes cochées → <b>'+L.pages.length+'</b> feuille'+(L.pages.length>1?"s":"")+' A4 ('+per+' par feuille)</span>'
        + '<button class="btn acc" id="doPrint">Imprimer</button></div>';
  h += '<div class="row"><span class="lab" style="min-width:0;flex:1">Emplacements déjà utilisés sur la 1<sup>re</sup> feuille</span>'
     + '<div class="stp"><button id="skm">−</button><b>'+P.skip+'</b><button id="skp">+</button></div></div>';
  h += '<div class="row"><span class="lab" style="min-width:0">Zoom</span><button class="btn" id="pzo">−</button>'
     + '<button class="btn" id="pzf">'+Math.round(P.zoom*100)+' %</button><button class="btn" id="pzi">+</button>'
     + '<span class="meta" style="flex:1;text-align:right">Les cartes se placent du bas vers le haut.</span></div>';
  $("printTb").innerHTML = h;
  $("doPrint").onclick = doPrint;
  $("skm").onclick = function(){ P.skip = Math.max(0, P.skip-1); saveP(); renderPrint(); };
  $("skp").onclick = function(){ P.skip = Math.min(per-1, P.skip+1); saveP(); renderPrint(); };
  $("pzo").onclick = function(){ setZoom(P.zoom/1.25); };
  $("pzi").onclick = function(){ setZoom(P.zoom*1.25); };
  $("pzf").onclick = function(){ setZoom(1); };
}
function setZoom(z){
  P.zoom = Math.max(.4, Math.min(5, z)); saveP();
  $("pzf").textContent = Math.round(P.zoom*100) + " %";
  sizePages();
}
function sizePages(){
  var sc = $("pscroll");
  var fitK = Math.min((sc.clientWidth - 32)/(PW*MM), 1);
  var k = fitK * P.zoom;
  Array.prototype.forEach.call(document.querySelectorAll("#pages .pw"), function(pw){
    pw.style.width = (PW*MM*k) + "px"; pw.style.height = (PH*MM*k) + "px";
    pw.firstChild.style.transform = "scale("+k+")";
  });
  $("pages").style.alignItems = P.zoom > 1 ? "flex-start" : "center";
}
function renderPrint(){
  var L = layoutPages(), G = L.G, box = $("pages");
  renderPrintTb(L);
  box.innerHTML = "";
  if(!L.pages.length){
    box.innerHTML = '<div class="empty-list">Aucune carte à imprimer.<br>Cochez 🖨️ les cartes dans <b>Mes cartes</b>.</div>';
    return;
  }
  L.pages.forEach(function(pg){
    var pw = document.createElement("div"); pw.className = "pw";
    var page = document.createElement("div"); page.className = "page";
    page.innerHTML = '<div class="edge">haut de la feuille</div>';
    Object.keys(pg.slots).forEach(function(k){
      var i = +k, r = Math.floor(i/G.cols), col = i % G.cols;
      var x = G.x0 + col*(G.w+G.g), y = G.t + r*(G.h+G.g);
      var sb = document.createElement("div");
      sb.className = "slotbox";
      sb.style.cssText = "left:"+(x-G.bx)+"mm;top:"+(y-G.by)+"mm;width:"+(G.w+2*G.bx)+"mm;height:"+(G.h+2*G.by)+"mm";
      sb.appendChild(cardEl(pg.slots[k], G.f, G.bx, G.by));
      var cut = document.createElement("div");
      cut.className = "scr";
      cut.style.cssText = "position:absolute;left:"+G.bx+"mm;top:"+G.by+"mm;width:"+G.w+"mm;height:"+G.h+"mm;border:.2mm dashed rgba(224,85,143,.7);pointer-events:none";
      sb.appendChild(cut);
      page.appendChild(sb);
    });
    pg.used.forEach(function(i){
      var r = Math.floor(i/G.cols), col = i % G.cols;
      var sb = document.createElement("div");
      sb.className = "slotbox used";
      sb.style.cssText = "left:"+(G.x0 + col*(G.w+G.g))+"mm;top:"+(G.t + r*(G.h+G.g))+"mm;width:"+G.w+"mm;height:"+G.h+"mm";
      page.appendChild(sb);
    });
    if(P.marks) drawMarks(page, G, Object.keys(pg.slots).map(Number));
    pw.appendChild(page); box.appendChild(pw);
  });
  sizePages();
}
function drawMarks(page, G, idx){
  if(!idx.length) return;
  var rows = {}, cols = {}, minR = 1e9, maxR = -1;
  idx.forEach(function(i){ var r = Math.floor(i/G.cols); rows[r] = 1; cols[i % G.cols] = 1; minR = Math.min(minR, r); maxR = Math.max(maxR, r); });
  var L = 4, T = .15, PAD = .8;
  function tick(x,y,w,h){
    var m = document.createElement("div"); m.className = "mark";
    m.style.cssText = "left:"+x+"mm;top:"+y+"mm;width:"+w+"mm;height:"+h+"mm";
    page.appendChild(m);
  }
  var xL = G.x0 - G.bx - PAD, xR = G.x0 + G.gw + G.bx + PAD;
  var lenL = Math.min(L, Math.max(0, xL - 3)), lenR = Math.min(L, Math.max(0, PW - 3 - xR));
  Object.keys(rows).forEach(function(r){
    var y0 = G.t + (+r)*(G.h+G.g);
    [y0, y0+G.h].forEach(function(y){
      if(lenL > .5) tick(xL-lenL, y-T/2, lenL, T);
      if(lenR > .5) tick(xR, y-T/2, lenR, T);
    });
  });
  var yT = G.t + minR*(G.h+G.g) - G.by - PAD, yB = G.t + maxR*(G.h+G.g) + G.h + G.by + PAD;
  var lenT = Math.min(L, Math.max(0, yT - 3)), lenB = Math.min(L, Math.max(0, PH - 3 - yB));
  Object.keys(cols).forEach(function(c){
    var x0 = G.x0 + (+c)*(G.w+G.g);
    [x0, x0+G.w].forEach(function(x){
      if(lenT > .5) tick(x-T/2, yT-lenT, T, lenT);
      if(lenB > .5) tick(x-T/2, yB, T, lenB);
    });
  });
}
function doPrint(){
  if(!printList().length){ toast("Rien à imprimer."); return; }
  try{ window.print(); }catch(e){ toast("Impression impossible ici : ouvrez l'app depuis votre site GitHub."); }
}

/* ---------- navigation ---------- */
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick = function(){ showView(t.dataset.view); };
});
function showView(v){
  S.view = v;
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("on", t.dataset.view===v); });
  $("vlist").classList.toggle("on", v==="list");
  $("vprint").classList.toggle("on", v==="print");
  if(v==="print") renderPrint(); else renderList();
}

/* ---------- réglages ---------- */
function openSettings(){
  var h = '<h2>Réglages</h2>';
  h += '<div class="sec" style="border:0;margin-top:0;padding-top:0">Cartes</div>';
  h += '<div class="grid2">'
     + '<div class="field"><span class="lab">Style</span><select id="sStyle"><option value="cute">Mignon</option><option value="classic">Classique</option></select></div>'
     + '<div class="field"><span class="lab">Ami / Ennemi</span><select id="sMarker"><option value="sym">Visages 😊 / 😠</option><option value="ban">Bandeau AMI / ENNEMI</option><option value="none">Aucun</option></select></div>'
     + '<div class="field"><span class="lab">Bordure (mm)</span><input type="number" id="sFrame" step="0.5" min="0" max="10"></div>'
     + '</div>';
  h += '<div class="sec">Feuille A4</div>';
  h += '<div class="grid2">'
     + '<div class="field"><span class="lab">Largeur carte (mm)</span><input type="number" id="sW" step="0.5"></div>'
     + '<div class="field"><span class="lab">Hauteur carte (mm)</span><input type="number" id="sH" step="0.5"></div>'
     + '<div class="field"><span class="lab">Écart (mm)</span><input type="number" id="sG" step="0.5"></div>'
     + '<div class="field"><span class="lab">Marge haute (mm)</span><input type="number" id="sT" step="0.5"></div>'
     + '<div class="field"><span class="lab">Fond perdu (%)</span><input type="number" id="sB" step="0.5"></div>'
     + '<div class="field"><span class="lab">Correction d\'échelle (%)</span><input type="number" id="sC" step="0.1"></div>'
     + '</div>';
  h += '<div class="row" style="margin-top:10px"><label class="meta"><input type="checkbox" id="sM"> Repères de coupe</label></div>';
  h += '<div class="sec">Sauvegarde</div>';
  h += '<div class="meta" style="margin-bottom:8px">Les cartes et images restent sur cet appareil, dans ce navigateur. Exportez une sauvegarde pour les transférer ailleurs.</div>';
  h += '<div class="row"><button class="btn" id="sExp">Exporter</button><button class="btn" id="sImp">Importer</button><div style="flex:1"></div><button class="btn acc" id="sClose">OK</button></div>';
  $("sheetIn").innerHTML = h;
  $("sStyle").value = P.style; $("sMarker").value = P.marker; $("sFrame").value = P.frame; 
  $("sW").value = P.cardW; $("sH").value = P.cardH; $("sG").value = P.gap; $("sT").value = P.top; $("sB").value = P.bleed; $("sC").value = P.comp;
  $("sM").checked = P.marks;
  function num(id, key, min, max){
    $(id).onchange = function(){ var v = parseFloat(this.value); if(!isNaN(v)){ P[key] = Math.max(min, Math.min(max, v)); saveP(); } this.value = P[key]; refresh(); };
  }
  num("sFrame","frame",0,10); num("sW","cardW",20,200); num("sH","cardH",20,280); num("sG","gap",0,30); num("sT","top",0,60); num("sB","bleed",0,20); num("sC","comp",80,120);
  $("sStyle").onchange = function(){ P.style = this.value; saveP(); refresh(); };
  $("sMarker").onchange = function(){ P.marker = this.value; saveP(); refresh(); };
  $("sM").onchange = function(){ P.marks = this.checked; saveP(); refresh(); };
  $("sExp").onclick = exportAll;
  $("sImp").onclick = function(){ $("fileImp").click(); };
  $("sClose").onclick = function(){ $("sheet").classList.remove("on"); };
  $("sheet").classList.add("on");
}
$("btnSet").onclick = openSettings;
$("sheet").addEventListener("click", function(e){ if(e.target===this) this.classList.remove("on"); });
function refresh(){
  if(S.edit) renderEditor();
  if(S.view==="print") renderPrint(); else renderList();
}

function blobToDataURL(b){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); }; fr.onerror = function(){ rej(fr.error); };
    try{ fr.readAsDataURL(b); }catch(e){ rej(e); }
  });
}
function exportAll(){
  toast("Préparation de la sauvegarde…");
  idb("photos","readonly",function(st){ return st.getAll(); }).then(function(rows){
    rows = rows || [];
    return Promise.all(rows.map(function(r){ return recData(r).then(function(u){ return [r.id, u]; }, function(){ return [r.id, null]; }); }));
  }).then(function(pairs){
    var photos = {}; pairs.forEach(function(p){ if(p[1]) photos[p[0]] = p[1]; });
    var data = JSON.stringify({app:"cartes-atelier", v:2, P:P, cards:S.cards, photos:photos});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    a.download = "cartes-sauvegarde.json";
    document.body.appendChild(a); a.click(); a.remove();
    hideToast();
  });
}
$("fileImp").addEventListener("change", function(){
  var f = this.files && this.files[0]; this.value = "";
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    var d; try{ d = JSON.parse(fr.result); }catch(e){ toast("Fichier illisible."); return; }
    if(!d || d.app!=="cartes-atelier"){ toast("Ce n'est pas une sauvegarde de cartes."); return; }
    ask("Remplacer toutes les cartes actuelles par celles de la sauvegarde ?", "Remplacer", function(){ doImport(d); }, true);
  };
  fr.readAsText(f);
});
function doImport(d){
    var jobs = Object.keys(d.photos||{}).map(function(id){
      S.photos[id] = d.photos[id];
      return savePhoto(id, d.photos[id]);
    });
    Promise.all(jobs).then(function(){
      return idb("cards","readwrite",function(st){ return st.clear(); });
    }).then(function(){
      S.cards = d.cards || [];
      S.cards.forEach(putCard);
      if(d.P){ for(var k in d.P) P[k] = d.P[k]; saveP(); }
      $("sheet").classList.remove("on");
      refresh(); toast("Sauvegarde importée");
    });
}

/* ---------- confirmation intégrée (confirm() est bloqué dans certains affichages) ---------- */
function ask(msg, okLabel, fn, danger){
  var box = $("ask");
  box.querySelector(".msg").textContent = msg;
  var ok = box.querySelector(".ok");
  ok.textContent = okLabel || "OK";
  ok.className = "btn ok " + (danger ? "dng" : "acc");
  ok.onclick = function(){ box.classList.remove("on"); fn(); };
  box.querySelector(".no").onclick = function(){ box.classList.remove("on"); };
  box.classList.add("on");
}

/* ---------- divers ---------- */
var tt = null;
function toast(msg, ms){
  var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(hideToast, ms || 2600);
}
function hideToast(){ $("toast").classList.remove("on"); }
window.addEventListener("resize", function(){
  if(S.edit) renderPreview();
  if(S.view==="print") sizePages();
});

/* ---------- démarrage ---------- */
idbOpen().then(function(){
  return Promise.all([
    idb("cards","readonly",function(st){ return st.getAll(); }),
    idb("photos","readonly",function(st){ return st.getAll(); })
  ]);
}).then(function(r){
  S.cards = r[0] || [];
  return Promise.all((r[1] || []).map(function(p){
    return recData(p).then(function(d){ S.photos[p.id] = d; }, function(){});
  }));
}).then(function(){
  if(!DB.ok) toast("Stockage indisponible : les cartes ne seront pas gardées après fermeture.", 5000);
  renderList();
});
</script>
